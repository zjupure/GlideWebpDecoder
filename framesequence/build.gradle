plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace "com.bumptech.glide.integration.framesequence"

    ndkVersion "${NDK_VERSION}"
    compileSdkVersion COMPILE_SDK_VERSION as int
    buildToolsVersion BUILD_TOOLS_VERSION as String

    defaultConfig {
        minSdkVersion MIN_SDK_VERSION as int
        targetSdkVersion TARGET_SDK_VERSION as int

        ndk {
            abiFilter "armeabi-v7a"
            abiFilter "armeabi"
            abiFilter "arm64-v8a"
            abiFilter "x86"
            abiFilter "x86_64"
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    sourceSets {
        main {
            jni.srcDirs = []
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    compileOnly "androidx.annotation:annotation:1.7.1"
    implementation("com.github.bumptech.glide:glide:${GLIDE_VERSION}"){
        exclude group:"com.android.support"
    }
    //annotationProcessor "com.github.bumptech.glide:compiler:${GLIDE_VERSION}"
    ksp "com.github.bumptech.glide:ksp:${GLIDE_VERSION}"
    compileOnly "androidx.fragment:fragment:1.9.1"
}

task copyLibwebp(type: Copy) {
    def sourceDir = new File(project(':webp_decoder').projectDir, "src/main/jni/libwebp")
    def targetDir = new File(projectDir, "src/main/jni/libwebp")
    targetDir.deleteDir()

    from sourceDir
    into targetDir
    include("**/**.c")
    include("**/**.h")
    include("**.mk")
    include("**/**.rc")
    include("**/**.in")
}

afterEvaluate {
    project.tasks.findAll {
        it.name.startsWith("externalNativeBuild")
    } .each {
        it.dependsOn copyLibwebp
    }
    copyLibwebp.execute()
}

apply from: "${rootProject.projectDir}/release-bintray.gradle"
