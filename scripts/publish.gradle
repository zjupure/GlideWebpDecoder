apply plugin: 'maven-publish'
apply plugin: 'signing'

ext["signing.keyId"] = ''
ext["signing.password"] = ''
ext["signing.secretKeyRingFile"] = ''
ext["ossrhUsername"] = ''
ext["ossrhPassword"] = ''

File secretPropsFile = project.rootProject.file('local.properties')
if (secretPropsFile.exists()) {
    println "Found secret props file, loading props"
    Properties p = new Properties()
    p.load(new FileInputStream(secretPropsFile))
    p.each { name, value ->
        ext[name] = value
    }
} else {
    println "No props file, loading env vars"
}

// JIRA: https://issues.sonatype.org/browse/OSSRH-65440?page=com.atlassian.jira.plugin.system.issuetabpanels%3Aall-tabpanel
// Sonatype: https://s01.oss.sonatype.org/

version = VERSION_NAME
group = GROUP

def getReleaseRepositoryUrl() {
    return hasProperty('LOCAL') ? localMavenRepo()
            : hasProperty('RELEASE_REPOSITORY_URL') ? RELEASE_REPOSITORY_URL
            : 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
}

def getSnapshotRepositoryUrl() {
    return hasProperty('LOCAL') ? localMavenRepo()
            : hasProperty('SNAPSHOT_REPOSITORY_URL') ? SNAPSHOT_REPOSITORY_URL
            : 'https://central.sonatype.com/repository/maven-snapshots/'
}

def getRepositoryUsername() {
    return hasProperty('ossrhUsername') ? ossrhUsername : (hasProperty('NEXUS_USERNAME') ? NEXUS_USERNAME : '')
}

def getRepositoryPassword() {
    return hasProperty('ossrhPassword') ? ossrhPassword : (hasProperty('NEXUS_PASSWORD') ? NEXUS_PASSWORD : '')
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // The coordinates of the library, being set from variables that
                // we'll set up in a moment
                groupId GROUP
                artifactId POM_ARTIFACT_ID
                version VERSION_NAME

                // Two artifacts, the `aar` and the sources
                afterEvaluate {
                    from components.release
                }

                // Self-explanatory metadata for the most part
                pom {
                    name = POM_NAME
                    description = POM_DESCRIPTION
                    // If your project has a dedicated site, use its URL here
                    url = POM_URL
                    licenses {
                        license {
                            //协议类型，一般默认Apache License2.0的话不用改：
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                            email = POM_DEVELOPER_EMAIL
                        }
                    }
                    // Version control info, if you're using GitHub, follow the format as seen here
                    scm {
                        //只读访问地址：
                        connection = POM_SCM_CONNECTION
                        //开发者读写地址：
                        developerConnection = POM_SCM_DEV_CONNECTION
                        //Github地址
                        url = POM_SCM_URL
                    }
                }
            }
        }
        repositories {
            // The repository to publish to, Sonatype/MavenCentral
            maven {
                // This is an arbitrary name, you may also use "mavencentral" or
                // any other name that's descriptive for you
                name = "MavenCentral"

                def releasesRepoUrl = getReleaseRepositoryUrl()
                //"https://oss.sonatype.org/service/local/staging/deploy/maven2/"
                def snapshotsRepoUrl = getSnapshotRepositoryUrl()
                //"https://oss.sonatype.org/content/repositories/snapshots/"
                // You only need this if you want to publish snapshots, otherwise just set the URL
                // to the release repo directly
                url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl

                // The username and password we've fetched earlier
                def ossrhUsername = getRepositoryUsername()
                def ossrhPassword = getRepositoryPassword()
                credentials {
                    username ossrhUsername
                    password ossrhPassword
                }
            }
        }
    }
    signing {
        sign publishing.publications.release
    }

    // maven-publish 采用逐个 PUT 文件的 "Maven-like" 上传方式，OSSRH Staging API 兼容服务
    // 无法感知一次部署何时结束，因此上传完成后必须调用该手动端点，部署才会出现在
    // Central Publisher Portal（https://central.sonatype.com/publishing）中。
    // 注意：认证需使用 Central Portal User Token（旧 OSSRH token 会返回 401）。
    tasks.register("releaseDeploymentToCentralPortal") {
        description = 'Uploads the staged deployment to the Central Publisher Portal'
        group = 'publishing'
        // SNAPSHOT 直接发布到 Portal 快照仓库，不走 staging，无需调用手动上传端点
        onlyIf { !project.version.toString().endsWith('SNAPSHOT') }
        dependsOn tasks.named("publishReleasePublicationToMavenCentralRepository")
        doLast {
            def portalToken = ("${getRepositoryUsername()}:${getRepositoryPassword()}")
                    .getBytes('UTF-8').encodeBase64().toString()
            def uploadUrl = "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${GROUP}"
            HttpURLConnection conn = (HttpURLConnection) new URL(uploadUrl).openConnection()
            conn.requestMethod = 'POST'
            conn.setRequestProperty('Authorization', "Bearer ${portalToken}")
            int code = conn.responseCode
            if (code >= 300) {
                def error = conn.errorStream != null ? conn.errorStream.getText('UTF-8') : ''
                throw new GradleException("Failed to upload deployment to Central Portal: HTTP ${code} ${error}")
            }
            println "Deployment uploaded. Release it at https://central.sonatype.com/publishing"
        }
    }
}